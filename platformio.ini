[env:esp32_wroom]
platform = espressif32@6.6.0
board = esp32dev 
framework = arduino
lib_extra_dirs = C:\Users\huval\Documents\Arduino\libraries
board_build.filesystem = littlefs
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.0.0 ;@ ^6.21.0
	bitbank2/AnimatedGIF@^2.1.0
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
