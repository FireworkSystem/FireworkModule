; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32_wroom]
platform = espressif32@6.6.0
board = diymore_esp32s3_n16r8
framework = arduino
board_build.flash_freq = 40m
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_extra_dirs = C:\Users\huval\Documents\Arduino\libraries
lib_ignore = Heltec ESP32 Dev-Boards
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.0.0 ;@ ^6.21.0
	bitbank2/AnimatedGIF@^2.1.0
	fastled/FastLED@^3.7.0
build_flags =
	-D USER_SETUP_LOADED
	-include "${PROJECT_INCLUDE_DIR}/User_Setup.h"
upload_port = COM14
monitor_port = COM14
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
